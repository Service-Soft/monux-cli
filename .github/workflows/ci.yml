name: CI
on: 
    push:
        branches-ignore: [release]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '24'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: docker/setup-compose-action@v1
            - uses: actions/checkout@v4
            - run: docker pull adminer
            - run: docker pull postgres
            - uses: actions/setup-node@v4
              with:
                node-version: '24'
                registry-url: 'https://registry.npmjs.org'
            # the clis of the frameworks run through npx, in the versions Monux pins
            - run: npm ci
            # the browser lighthouse and the privacy check of the generated websites run in
            - run: npx playwright-core install --with-deps chromium
            - run: npm run build
            - run: npm run test