<h2 class="font-heading text-title">{{ toTenant ? 'Invite to the tenant' : 'Invite to the application' }}</h2>
<ui-form class="mt-4 grid gap-4" (submit)="invite()">
    <ui-input-string name="email" type="email" autocomplete="off" label="Email" [(value)]="email" />
    <ui-input-string name="name" autocomplete="off" label="Name" [(value)]="name" />
    <ui-input-chips label="Roles" [required]="false" [options]="roleOptions.hasValue() ? roleOptions.value() : []" [(value)]="roles" />
    <ui-input-select label="Account created" [options]="createOnOptions" [(value)]="createOn" />
    <ui-input-boolean label="Can be declined" [(value)]="declinable" />
    <!-- cancel comes first: the dialog focuses its first button, so pressing enter right away never sends -->
    <div class="flex flex-wrap justify-end gap-2">
        <button ui-button type="button" variant="text" (click)="dialogRef.close(false)">Cancel</button>
        <button ui-button type="submit">Invite</button>
    </div>
</ui-form>
<div class="mt-4 text-body text-error empty:hidden" role="alert">
    @for (paragraph of errorParagraphs(); track $index) {
        <p>{{ paragraph }}</p>
    }
</div>
